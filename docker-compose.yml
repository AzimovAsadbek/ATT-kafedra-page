# Lokal ishlab chiqish uchun PostgreSQL. Ishga tushirish: npm run db:up
# Ulanish: DATABASE_URL=postgres://att:att@localhost:5432/att (.env.example)
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: att
      POSTGRES_PASSWORD: att
      POSTGRES_DB: att
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U att -d att"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
